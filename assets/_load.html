<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>LanPlay Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #DFF3FF;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .splash-img {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center top;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            z-index: 10;
        }
        /* 彻底隐藏 p4a 默认 .loader 三根紫色柱 */
        .loader, .loader:before, .loader:after {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
            animation: none !important;
            -webkit-animation: none !important;
        }
    </style>
</head>
<body>
    <img class="splash-img" src="_presplash.png" alt="LanPlay Monitor">
