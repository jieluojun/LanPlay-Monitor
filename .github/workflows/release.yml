name: Build Android APK Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类标签时触发
      - '*'           # 也可改为任意 tag 都触发，自行选择

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境（Buildozer 需要 Python 3.8+）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装系统依赖（Buildozer 编译 Android 所需）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev
          pip3 install --upgrade pip setuptools

      # 4. 安装 Buildozer 和 Cython
      - name: Install Buildozer
        run: |
          pip3 install buildozer cython

      # 5. 恢复缓存的 Buildozer 依赖（加速后续构建）
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 6. 解码密钥库文件（从 GitHub Secrets 读取）
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /home/runner/work/python-apk/AndAgain/com.lanplay.monitor.keystore
            chmod 600 /home/runner/work/python-apk/AndAgain/com.lanplay.monitor.keystore
            echo "Keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not set. Build will use debug keystore."
          fi

      # 7. 用 Buildozer 构建 APK
      - name: Build APK with Buildozer
        run: |
          buildozer android clean
          buildozer android debug

      # 8. 定位生成的 APK 文件
      - name: Locate APK file
        id: locate_apk
        run: |
          APK_PATH=$(find bin/ -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in bin/"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      # 9. 创建 GitHub Release 并上传 APK
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
