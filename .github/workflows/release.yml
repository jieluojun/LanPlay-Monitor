name: Build Android APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.1）'
        required: true
        default: '1.0.1'
        type: string

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装系统依赖（增加必要工具）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev ccache
          pip3 install --upgrade pip setuptools

      # 4. 安装 Buildozer 和 Cython（使用清华镜像加速）
      - name: Install Buildozer
        run: |
          pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip3 install buildozer cython

      # 5. 缓存 Buildozer 全局目录
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 6. 解码密钥库文件
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not set."
            echo "请前往 Settings → Secrets and variables → Actions 添加 KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          echo "$KEYSTORE_BASE64" | base64 -d > /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/com.lanplay.monitor.keystore
          chmod 600 /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/com.lanplay.monitor.keystore
          echo "Keystore decoded successfully."

      # 7. 更新版本号
      - name: Update version in buildozer.spec
        run: |
          sed -i "s/^version = .*/version = ${{ inputs.version }}/" buildozer.spec
          echo "Version set to: ${{ inputs.version }}"
          grep "^version" buildozer.spec

      # 8. 构建 APK（强制输出 APK 格式）
      - name: Build APK with Buildozer
        run: |
          # 清除冲突的环境变量
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          unset ANDROID_SDK_ROOT
          unset ANDROID_HOME
          
          # 强制使用 Java 17
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          # 设置镜像加速
          export P4A_mirror=https://mirrors.tuna.tsinghua.edu.cn/gitlab/kivy/
          
          # 验证环境
          java -version
          
          # 强制构建 APK（不是 AAB）
          buildozer -v android release --package-format=apk

      # 9. 定位生成的 APK
      - name: Locate APK file
        id: locate_apk
        run: |
          APK_PATH=$(find bin/ -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in bin/"
            ls -la bin/ || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      # 10. 上传 APK 为 Artifact
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanPlayMonitor-v${{ inputs.version }}-release
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      # 11. 创建 GitHub Release 并上传 APK
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          files: ${{ steps.locate_apk.outputs.apk_path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
