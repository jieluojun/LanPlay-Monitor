name: Build Android APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.1）'
        required: true
        default: '1.0.1'
        type: string

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装系统依赖（增加必要工具）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev ccache
          pip3 install --upgrade pip setuptools

      # 4. 安装 Buildozer 和 Cython（使用清华镜像加速）
      - name: Install Buildozer
        run: |
          pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip3 install buildozer cython

      # 5. 缓存 Buildozer 全局目录
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 6. 解码密钥库文件
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not set."
            echo "请前往 Settings → Secrets and variables → Actions 添加 KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          echo "$KEYSTORE_BASE64" | base64 -d > /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/com.lanplay.monitor.keystore
          chmod 600 /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/com.lanplay.monitor.keystore
          echo "Keystore decoded successfully."

      # 7. 更新版本号
      - name: Update version in buildozer.spec
        run: |
          sed -i "s/^version = .*/version = ${{ inputs.version }}/" buildozer.spec
          echo "Version set to: ${{ inputs.version }}"
          grep "^version" buildozer.spec

      # 8. 构建 APK
      - name: Build APK with Buildozer
        run: |
          # 清除冲突的环境变量
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          unset ANDROID_SDK_ROOT
          unset ANDROID_HOME
          
          # 强制使用 Java 17
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          # 设置镜像加速
          export P4A_mirror=https://mirrors.tuna.tsinghua.edu.cn/gitlab/kivy/
          
          # 验证环境
          java -version
          
          # 构建应用
          buildozer -v android release

      # 9. 定位 APK，如果不存在则从 AAB 转换（修复：自动处理 AAB 转 APK）
      - name: Locate APK or convert from AAB
        id: locate_or_convert
        run: |
          # 先尝试找 APK
          APK_PATH=$(find bin/ -name "*.apk" | head -1)
          
          if [ -n "$APK_PATH" ]; then
            echo "Found APK directly: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "No APK found, trying to convert from AAB..."
            
            # 查找 AAB 文件
            AAB_PATH=$(find bin/ -name "*.aab" | head -1)
            if [ -z "$AAB_PATH" ]; then
              echo "Error: No APK or AAB file found in bin/"
              ls -la bin/ || true
              exit 1
            fi
            echo "Found AAB: $AAB_PATH"
            
            # 下载 bundletool
            wget -q https://github.com/google/bundletool/releases/download/1.15.4/bundletool-all-1.15.4.jar -O bundletool.jar
            
            # 从 buildozer.spec 中读取签名信息
            KEY_ALIAS=$(grep "^android.keystore_alias" buildozer.spec | cut -d'=' -f2 | tr -d ' ')
            STORE_PASS=$(grep "^android.keystore_storepass" buildozer.spec | cut -d'=' -f2 | tr -d ' ')
            KEY_PASS=$(grep "^android.keystore_keypass" buildozer.spec | cut -d'=' -f2 | tr -d ' ')
            KEYSTORE_PATH="./com.lanplay.monitor.keystore"
            
            echo "Using alias: $KEY_ALIAS"
            
            # 使用 bundletool 生成 APKs 集合
            java -jar bundletool.jar build-apks \
              --bundle="$AAB_PATH" \
              --output=bin/output.apks \
              --mode=universal \
              --ks="$KEYSTORE_PATH" \
              --ks-key-alias="$KEY_ALIAS" \
              --ks-pass=pass:"$STORE_PASS" \
              --key-pass=pass:"$KEY_PASS"
            
            # 解压并重命名
            unzip -o bin/output.a